[package]
name = "bench"
version = "0.14.0"
edition = "2021"
rust-version = "1.89"
description = "Native executable and Python benchmark CLI for Linux"
license = "MIT"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"
roxmltree = "0.20"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
# Optional `bench account` OAuth client for the local Keycloak stack in auth/.
accounts = ["dep:reqwest", "dep:base64", "dep:zeroize"]

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
