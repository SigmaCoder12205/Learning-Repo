[package]
name = "cppbench"
version = "0.5.0"
edition = "2021"
description = "Native Rust and C process benchmark CLI for Linux"
license = "MIT"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"
roxmltree = "0.20"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
